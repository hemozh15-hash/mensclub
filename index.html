<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MC Men's Club | انضم لفريقنا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--card:#ffffff;--line:#dedede;--or:#e11d2a;--or2:#9b1119;--tx:#1a1a1a;--mu:#666;--err:#d71920}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,sans-serif;line-height:1.6;padding:0 0 40px}
body:before{content:"";position:fixed;top:0;inset-inline-start:0;width:180px;height:180px;background:linear-gradient(135deg,var(--or),var(--or2));clip-path:polygon(0 0,100% 0,0 100%);opacity:.9;pointer-events:none}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{text-align:center;padding:28px 0 8px}
.logo{font-weight:800;font-size:44px;letter-spacing:4px}.logo b{color:var(--or)}
h1{font-size:34px;font-weight:800;margin:6px 0 0;line-height:1.2}h1 em{font-style:normal;color:var(--or)}
img.logo{display:block;margin:0 auto;width:260px;max-width:70%;height:auto;mix-blend-mode:multiply}.sub{color:var(--mu);margin:6px 0 0}
.lang{position:absolute;top:12px;inset-inline-end:12px;background:none;border:1px solid var(--or);color:var(--or);border-radius:20px;padding:4px 14px;font:inherit;cursor:pointer;z-index:2}
.branch{display:inline-block;margin-top:12px;border:2px solid var(--or);border-radius:30px;padding:2px 16px;font-weight:600}
.bar{display:flex;gap:6px;margin:20px 0}.bar i{flex:1;height:5px;border-radius:3px;background:var(--line)}.bar i.on{background:var(--or)}
form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.step{display:none}.step.on{display:block}
h2{margin:0 0 14px;font-size:20px;color:var(--or)}
label{display:block;font-weight:600;margin:14px 0 4px;font-size:15px}
input,select,textarea{width:100%;background:#fafafa;border:1.5px solid var(--line);border-radius:10px;color:var(--tx);padding:11px 12px;font:inherit;font-size:16px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--or)}
input.bad,select.bad{border-color:var(--err)}
.row{display:flex;gap:10px}.row>div{flex:1}
.hint{color:var(--mu);font-size:13px;margin-top:3px}
#map{height:230px;border-radius:12px;margin-top:10px;border:1px solid var(--line)}
.geo{margin-top:8px;background:none;border:1.5px dashed var(--or);color:var(--or);border-radius:10px;padding:9px;width:100%;font:inherit;cursor:pointer}
gmp-place-autocomplete{width:100%;color-scheme:dark}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin-top:16px}.chk input{width:auto;margin-top:6px}
.nav{display:flex;gap:10px;margin-top:22px}
button.p,button.s{flex:1;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:800;font-size:17px;cursor:pointer}
button.p{background:linear-gradient(135deg,var(--or),var(--or2));color:#fff}
button.s{background:var(--line);color:var(--tx)}
button:disabled{opacity:.5}
.done{text-align:center;padding:30px 10px}.done h2{font-size:26px;color:var(--tx)}
.hide{display:none!important}
#msg{color:var(--err);margin-top:10px;min-height:20px}
</style>
</head>

 <h1><span data-ar="عايزينكم" data-en="We want you">عايزينكم</span> <em data-ar="معانا" data-en="on our team">معانا</em></h1>
 <p class="sub" data-ar="سجّل بياناتك في دقيقتين وفريق الموارد البشرية هيراجع طلبك" data-en="Apply in two minutes. Our HR team will review your application.">سجّل بياناتك في دقيقتين وفريق الموارد البشرية هيراجع طلبك</p>
 <div class="branch hide" id="branchTag"></div>
</header>
<div class="bar" id="bar"><i class="on"></i><i></i><i></i><i></i></div>

<form id="f" novalidate>
<input type="hidden" name="lat"><input type="hidden" name="lng"><input type="hidden" name="lang" value="ar">

<section class="step on">
 <h2 data-ar="الوظيفة والبيانات الشخصية" data-en="Job and personal details">الوظيفة والبيانات الشخصية</h2>
 <label data-ar="فرع التقديم" data-en="Applying branch">فرع التقديم</label>
 <input name="branch" id="branch" required>
 <label data-ar="الوظيفة المستهدفة" data-en="Position">الوظيفة المستهدفة</label>
 <select name="position" required>
  <option value="" data-ar="اختر الوظيفة" data-en="Select a position"></option>
  <option value="Sales" data-ar="سيلز" data-en="Sales"></option>
  <option value="Deputy Manager" data-ar="نائب مدير" data-en="Deputy Manager"></option>
  <option value="Manager" data-ar="مدير" data-en="Manager"></option>
 </select>
 <label data-ar="الاسم الكامل (رباعي)" data-en="Full name (four names)">الاسم الكامل (رباعي)</label>
 <input name="name" required minlength="8" autocomplete="name">
 <div class="row">
  <div><label data-ar="النوع" data-en="Gender">النوع</label>
   <select name="gender" required><option value="" data-ar="اختر" data-en="Select"></option><option value="Male" data-ar="ذكر" data-en="Male"></option><option value="Female" data-ar="أنثى" data-en="Female"></option></select></div>
  <div><label data-ar="تاريخ الميلاد" data-en="Date of birth">تاريخ الميلاد</label>
   <input type="date" name="dob" id="dob" required></div>
 </div>
 <label data-ar="الرقم القومي (14 رقم)" data-en="National ID (14 digits)">الرقم القومي (14 رقم)</label>
 <input name="nid" inputmode="numeric" maxlength="14" required>
 <div class="row">
  <div><label data-ar="الحالة الاجتماعية" data-en="Marital status">الحالة الاجتماعية</label>
   <select name="marital" required><option value="" data-ar="اختر" data-en="Select"></option><option value="Single" data-ar="أعزب / عزباء" data-en="Single"></option><option value="Married" data-ar="متزوج / متزوجة" data-en="Married"></option><option value="Other" data-ar="أخرى" data-en="Other"></option></select></div>
  <div><label data-ar="موقف التجنيد" data-en="Military status">موقف التجنيد</label>
   <select name="military" required><option value="" data-ar="اختر" data-en="Select"></option><option value="Completed" data-ar="أدى الخدمة" data-en="Completed"></option><option value="Exempted" data-ar="إعفاء" data-en="Exempted"></option><option value="Postponed" data-ar="مؤجل" data-en="Postponed"></option><option value="Not called" data-ar="لم يُطلب" data-en="Not yet called"></option><option value="N/A" data-ar="لا ينطبق" data-en="Not applicable"></option></select></div>
 </div>
</section>

<section class="step">
 <h2 data-ar="التواصل والعنوان" data-en="Contact and address">التواصل والعنوان</h2>
 <label data-ar="رقم الموبايل" data-en="Mobile number">رقم الموبايل</label>
 <input name="phone" type="tel" inputmode="numeric" placeholder="01XXXXXXXXX" required autocomplete="tel">
 <label data-ar="رقم واتساب (لو مختلف)" data-en="WhatsApp (if different)">رقم واتساب (لو مختلف)</label>
 <input name="whatsapp" type="tel" inputmode="numeric" placeholder="01XXXXXXXXX">
 <label data-ar="البريد الإلكتروني (اختياري)" data-en="Email (optional)">البريد الإلكتروني (اختياري)</label>
 <input name="email" type="email">
 <label data-ar="عنوان سكنك" data-en="Your home address">عنوان سكنك</label>
 <input name="address" id="address" required autocomplete="street-address" placeholder="المحافظة - المنطقة - الشارع">
 <button class="geo" type="button" id="geoBtn" data-ar="📍 استخدم موقعي الحالي" data-en="📍 Use my current location">📍 استخدم موقعي الحالي</button>
 <p class="hint" data-ar="اكتب المحافظة والمنطقة والشارع، أو اضغط الزر عشان نحدد موقعك." data-en="Enter governorate, area and street, or tap the button to share your location.">اكتب المحافظة والمنطقة والشارع، أو اضغط الزر عشان نحدد موقعك.</p>
 <p class="hint" id="addrShow"></p>
</section>

<section class="step">
 <h2 data-ar="التعليم والخبرة" data-en="Education and experience">التعليم والخبرة</h2>
 <label data-ar="المؤهل الدراسي" data-en="Education level">المؤهل الدراسي</label>
 <select name="edu" required><option value="" data-ar="اختر" data-en="Select"></option><option value="Preparatory" data-ar="إعدادية" data-en="Preparatory"></option><option value="Secondary" data-ar="ثانوية" data-en="Secondary"></option><option value="Diploma" data-ar="دبلوم" data-en="Diploma"></option><option value="Institute" data-ar="معهد" data-en="Institute"></option><option value="Bachelor" data-ar="بكالوريوس / ليسانس" data-en="Bachelor's"></option><option value="Postgrad" data-ar="دراسات عليا" data-en="Postgraduate"></option></select>
 <label data-ar="التخصص / الكلية / الجامعة" data-en="Major / faculty / university">التخصص / الكلية / الجامعة</label>
 <input name="major">
 <div class="row">
  <div><label data-ar="سنة التخرج" data-en="Graduation year">سنة التخرج</label><input name="gradYear" inputmode="numeric" maxlength="4" placeholder="2024"></div>
  <div><label data-ar="لسه طالب؟" data-en="Still studying?">لسه طالب؟</label><select name="student"><option value="No" data-ar="لا" data-en="No"></option><option value="Yes" data-ar="نعم" data-en="Yes"></option></select></div>
 </div>
 <label data-ar="هل عندك خبرة سابقة؟" data-en="Any previous experience?">هل عندك خبرة سابقة؟</label>
 <select name="hasExp" id="hasExp"><option value="No" data-ar="لا" data-en="No"></option><option value="Yes" data-ar="نعم" data-en="Yes"></option></select>
 <div id="expBox" class="hide">
  <label data-ar="آخر جهة عمل" data-en="Last employer">آخر جهة عمل</label><input name="lastEmployer">
  <div class="row">
   <div><label data-ar="المسمى الوظيفي" data-en="Job title">المسمى الوظيفي</label><input name="lastTitle"></div>
   <div><label data-ar="مدة العمل" data-en="Duration">مدة العمل</label><input name="lastDuration" placeholder="2 years"></div>
  </div>
  <label data-ar="سبب ترك العمل" data-en="Reason for leaving">سبب ترك العمل</label><input name="leaveReason">
 </div>
 <label data-ar="لغات ومهارات (اختياري)" data-en="Languages and skills (optional)">لغات ومهارات (اختياري)</label>
 <input name="skills">
</section>

<section class="step">
 <h2 data-ar="الاستعداد للعمل" data-en="Availability">الاستعداد للعمل</h2>
 <label data-ar="تقدر تبدأ امتى؟" data-en="When can you start?">تقدر تبدأ امتى؟</label>
 <select name="startWhen" required><option value="" data-ar="اختر" data-en="Select"></option><option value="Immediately" data-ar="فوراً" data-en="Immediately"></option><option value="1 week" data-ar="خلال أسبوع" data-en="Within a week"></option><option value="2 weeks" data-ar="خلال أسبوعين" data-en="Within 2 weeks"></option><option value="1 month" data-ar="خلال شهر" data-en="Within a month"></option></select>
 <label data-ar="مستعد للعمل بنظام الورديات والإجازات الرسمية؟" data-en="Willing to work shifts and public holidays?">مستعد للعمل بنظام الورديات والإجازات الرسمية؟</label>
 <select name="shifts" required><option value="" data-ar="اختر" data-en="Select"></option><option value="Yes" data-ar="نعم" data-en="Yes"></option><option value="No" data-ar="لا" data-en="No"></option></select>
 <label data-ar="الراتب المتوقع (اختياري)" data-en="Expected salary (optional)">الراتب المتوقع (اختياري)</label>
 <input name="salary" inputmode="numeric">
 <label data-ar="عرفت عن الوظيفة منين؟" data-en="How did you hear about us?">عرفت عن الوظيفة منين؟</label>
 <select name="source"><option value="QR" data-ar="QR في الفرع" data-en="QR code in store"></option><option value="Facebook" data-ar="فيسبوك" data-en="Facebook"></option><option value="Friend" data-ar="صديق / موظف" data-en="Friend / employee"></option><option value="Other" data-ar="أخرى" data-en="Other"></option></select>
 <label data-ar="ملاحظات (اختياري)" data-en="Notes (optional)">ملاحظات (اختياري)</label>
 <textarea name="notes" rows="2"></textarea>
 <label class="chk"><input type="checkbox" id="consent" required><span data-ar="أوافق على استخدام بياناتي لأغراض التوظيف في MC Men's Club والتواصل معي بشأن طلبي." data-en="I agree that MC Men's Club may use my data for recruitment and contact me about my application.">أوافق على استخدام بياناتي لأغراض التوظيف في MC Men's Club والتواصل معي بشأن طلبي.</span></label>
 <div id="msg"></div>
</section>

</div>
</form>

<div class="done hide" id="done">
 <h2 data-ar="شكراً، طلبك اتسجل ✅" data-en="Thank you, your application is in ✅">شكراً، طلبك اتسجل ✅</h2>
 <p data-ar="فريق الموارد البشرية هيراجع بياناتك ويتواصل معاك قريباً." data-en="Our HR team will review your details and contact you soon.">فريق الموارد البشرية هيراجع بياناتك ويتواصل معاك قريباً.</p>
</div>
</div>

<script>
/* ====== اضبط القيمة دي ====== */
const SCRIPT_URL = "PUT_APPS_SCRIPT_WEB_APP_URL";
/* =============================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const f=$("#f"), steps=$$(".step"), bars=$$("#bar i");
let cur=0, lang="ar", map, marker, geocoder;

/* اللغة */
function setLang(l){
  lang=l; document.documentElement.lang=l; document.documentElement.dir=l==="ar"?"rtl":"ltr";
  $$("[data-ar]").forEach(e=>e.textContent=e.dataset[l]);
  $("#langBtn").textContent=l==="ar"?"English":"عربي"; f.lang.value=l;
}
$("#langBtn").onclick=()=>setLang(lang==="ar"?"en":"ar");
setLang("ar");

/* الفرع من الرابط ?branch= */
const qp=new URLSearchParams(location.search);const b=(qp.get("b")||qp.get("branch")||"").replace(/-/g," ").trim();
if(b){$("#branch").value=b;const t=$("#branchTag");t.textContent="📍 "+b;t.classList.remove("hide")}

/* أدوات */
const dig=s=>s.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
["nid","phone","whatsapp","gradYear","salary"].forEach(n=>f[n].addEventListener("input",e=>e.target.value=dig(e.target.value)));
$("#hasExp").onchange=e=>$("#expBox").classList.toggle("hide",e.target.value!=="Yes");
const T=(a,e)=>lang==="ar"?a:e;

/* التحقق */
function validate(i){
  let ok=true,msg="";
  $$(".step")[i].querySelectorAll("input[required],select[required]").forEach(el=>{
    let bad=el.type==="checkbox"?!el.checked:!el.value.trim();
    if(el.name==="nid"&&!/^\d{14}$/.test(el.value)) bad=true;
    if(el.name==="phone"&&!/^01[0125]\d{8}$/.test(el.value)) bad=true;
    if(el.name==="name"&&el.value.trim().split(/\s+/).length<3) bad=true;
    el.classList.toggle("bad",bad); if(bad)ok=false;
  });
  const w=f.whatsapp.value; if(i===1&&w&&!/^01[0125]\d{8}$/.test(w)){f.whatsapp.classList.add("bad");ok=false}
  if(!ok&&!msg)msg=T("راجع الحقول المظللة بالأحمر.","Please check the fields marked in red.");
  $("#msg").textContent=ok?"":msg; if(!ok)alert(msg); return ok;
}
function show(i){
  cur=i;steps.forEach((s,k)=>s.classList.toggle("on",k===i));bars.forEach((x,k)=>x.classList.toggle("on",k<=i));
  $("#back").classList.toggle("hide",i===0);
  $("#next").textContent=i===3?T("إرسال الطلب","Submit application"):T("التالي","Next");
  $("#next").dataset.ar=i===3?"إرسال الطلب":"التالي";$("#next").dataset.en=i===3?"Submit application":"Next";
  window.scrollTo({top:0,behavior:"smooth"}); 
}
$("#back").onclick=()=>show(cur-1);
$("#next").onclick=async()=>{
  if(!validate(cur))return;
  if(cur<3)return show(cur+1);
  const btn=$("#next");btn.disabled=true;btn.textContent="...";
  const data=Object.fromEntries(new FormData(f));data.submittedAt=new Date().toISOString();
  try{
    await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)});
    f.classList.add("hide");$("#bar").classList.add("hide");$("#done").classList.remove("hide");window.scrollTo(0,0);
  }catch(e){btn.disabled=false;show(3);$("#msg").textContent=T("حصلت مشكلة في الإرسال، حاول تاني.","Submission failed. Please try again.")}
};

/* موقعي الحالي (اختياري): بيحفظ lat/lng، ولو مضغطش بيتحدد الموقع من العنوان المكتوب */
$("#geoBtn").onclick=()=>{
  if(!navigator.geolocation)return alert(T("المتصفح لا يدعم تحديد الموقع.","Geolocation not supported."));
  navigator.geolocation.getCurrentPosition(
    p=>{f.lat.value=p.coords.latitude.toFixed(6);f.lng.value=p.coords.longitude.toFixed(6);$("#addrShow").textContent=T("تم تحديد موقعك ✅ وما تنساش تكتب عنوانك.","Location captured ✅ Please also type your address.")},
    ()=>alert(T("مقدرناش نحدد موقعك. اكتب عنوانك بالتفصيل.","Couldn't get your location. Please type your address.")),
    {enableHighAccuracy:true,timeout:15000});
};
</script>
</body>
</html>
